[phases.install]
cmds = [
  # The committed package-lock.json is generated on macOS; npm's optional-deps
  # bug (npm/cli#4828) then omits the Linux native bindings that vite 8 pulls in
  # (rolldown, lightningcss, …). Drop the platform-specific lockfile so npm
  # resolves the correct Linux optional deps fresh on the build host.
  "rm -f package-lock.json",
  "npm install --include=optional",
]

[phases.build]
cmds = [
  "npm run build --workspace=packages/core",
  "npm run build --workspace=packages/ui-server",
  "npm run build --workspace=packages/ui",
]

[start]
cmd = "npm run start --workspace=packages/ui-server"
