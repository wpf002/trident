[phases.install]
cmds = [
  "npm install --include=optional",
  # Vite 8 bundles the rolldown bundler (not rollup). Work around the npm
  # optional-deps bug (npm/cli#4828) by installing the Linux native binding
  # explicitly; keep this version in sync with `rolldown` in package-lock.json.
  "npm install --no-save --workspace=packages/ui @rolldown/binding-linux-x64-gnu@1.0.3",
]

[phases.build]
cmds = [
  "npm run build --workspace=packages/core",
  "npm run build --workspace=packages/ui-server",
  "npm run build --workspace=packages/ui",
]

[start]
cmd = "npm run start --workspace=packages/ui-server"
